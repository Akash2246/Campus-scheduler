<script>

function adminOld(){
 const cl=allClashes();
 let h=`<h2>Timetable conflicts</h2>`+(cl.length?cl.map(c=>`<div class="warn"><b>${esc(c.a.course)}</b> (${esc(c.a.section)}) and <b>${esc(c.b.course)}</b> (${esc(c.b.section)}) overlap on ${DAYS[c.a.day]}: same ${esc(c.why.join(", "))}.</div>`).join(""):'<p class="empty">No conflicts across '+slots.length+" classes.</p>");
 h+=`<h2 style="margin-top:18px">People</h2><ul>`+members.map(p=>`<li class="it"><span><span class="t">${esc(p.name)}</span><span class="badge">${esc(p.role)}</span>${p.status==="pending"?'<span class="badge" style="color:var(--danger);border-color:var(--danger)">awaiting approval</span>':""}<br><span class="meta">${p.section?"Section "+esc(p.section):""}</span></span><span>${p.status==="pending"?`<button class="btn sm" data-a="approve" data-id="${p.id}">Approve</button> `:""}<select data-a="setrole" data-id="${p.id}" aria-label="Role">${["student","faculty","admin"].map(r=>`<option${r===p.role?" selected":""}>${r}</option>`).join("")}</select> ${p.id!==me.id?`<button class="btn ghost sm" data-a="rmmem" data-id="${p.id}">Remove</button>`:""}</span></li>`).join("")+"</ul>";
 return h;
}
function render(){
 const a=document.activeElement;
 if(a&&/INPUT|SELECT/.test(a.tagName)&&$("#app").contains(a)){dirty=true;return}
 const app=$("#app");
 if(!loaded)return;
 const m=M();
 if(!m){
  if(me.isOwner)return;
  app.innerHTML=`<div class="panel gate"><h1>Campus Scheduler</h1><p class="meta">Create your profile to see timetables and deadlines.</p><form id="su"><label>Your name<input name="name" required maxlength="40" value="${esc(me.name)}"></label><label>I am a<select name="role"><option value="student">Student</option><option value="faculty">Faculty member</option></select></label><label>Section (students)<input name="section" maxlength="15" placeholder="CSE-A"></label><button class="btn">Create profile</button></form></div>`;return;
 }
 if(m.status==="pending"){app.innerHTML='<div class="panel gate"><h1>Waiting for approval</h1><p class="meta">An admin needs to approve your faculty account. This page updates when they do.</p><button class="btn sm" data-a="out">Sign out</button></div>';return}
 const bad=new Set();allClashes().forEach(c=>{bad.add(c.a.id);bad.add(c.b.id)});
 const un=vn(m).filter(n=>n.at>seen&&n.by!==me.id).length;const tabs=[["tt","Timetable"],["tk","Tasks and deadlines"],["pg","Progress"],["at","Attendance"],["nt","Notifications"+(un?" ("+un+" new)":"")],...(m.role==="admin"?[["ad","Admin"+(bad.size?" ("+bad.size+" clashing)":"")]]:[])];
 if(tab==="ad"&&m.role!=="admin")tab="tt";
 app.innerHTML=`<div class="top"><div><h1>Campus Scheduler</h1><span class="who">Live data, updated ${new Date(lastSync).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span><span class="who">${esc(m.name)}<span class="badge">${esc(m.role)}</span>${m.section?" · section "+esc(m.section):""}</span></div><button class="btn sm" data-a="out">Sign out</button></div><div class="tabs">${tabs.map(t=>`<button data-a="tab" data-id="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div><div class="panel">${tab==="tt"?ttHTML(m,bad):tab==="tk"?taskHTML(m):tab==="pg"?progHTML(m):tab==="at"?attHTML(m):tab==="nt"?noteHTML(m):adminHTML()}</div>`;
}
document.addEventListener("focusout",()=>{if(dirty){dirty=false;setTimeout(render,0)}});
const app=$("#app");
app.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT"||b.tagName==="INPUT")return;
 const a=b.dataset.a,id=b.dataset.id;
 if(a==="tab"){tab=id;err="";track("tab:"+id);render()}
 else if(a==="sel"){sel=id;render()}
 else if(a==="rmslot"){sel=null;safe(db.doc("slots/"+id).delete())}
 else if(a==="rmtask")safe(db.doc("tasks/"+id).delete());
 else if(a==="approve")safe(db.doc("members/"+id).update({status:"active"}));
 else if(a==="rmmem")safe(db.doc("members/"+id).delete());
 else if(a==="subopen"){subOpen=subOpen===id?null:id;render()}
 else if(a==="revopen"){revOpen=revOpen===id?null:id;render()}
 else if(a==="dl")report(id);
 else if(a==="out")SB.auth.signOut().then(()=>location.reload());
});
app.addEventListener("change",e=>{
 const t=e.target,a=t.dataset.a;if(!a)return;t.blur();
 if(a==="flt"){flt=t.value;render()}
 else if(a==="rng"){rng=+t.value;render()}
 else if(a==="aslot"){attSlot=t.value;render()}
 else if(a==="adate"){attDate=t.value||attDate;render()}
 else if(a==="tgt"){tgt=+t.value;render()}
 else if(a==="setrole")safe(db.doc("members/"+t.dataset.id).update({role:t.value,status:"active"}));
 else if(a==="done"){done[t.dataset.id]=t.checked;safe(db.collection("data/users/"+me.id).doc("done").set({m:done}))}
});
app.addEventListener("submit",e=>{
 e.preventDefault();const f=new FormData(e.target),id=e.target.id,v=k=>(f.get(k)||"").toString().trim(),m=M();
 document.activeElement&&document.activeElement.blur();
 if(id==="su"){const role=v("role");safe(db.doc("members/"+me.id).set({name:v("name"),role,section:v("section"),status:role==="faculty"?"pending":"active"}))}
 else if(id==="tf"){safe(db.collection("tasks").add({title:v("title"),course:v("course"),due:v("due"),section:v("section"),scope:staff()?"class":"personal",by:me.id,byName:m.name})).then(()=>{e.target.reset();if(staff())notify(v("section")?"sec:"+v("section"):"all","New deadline: "+v("title"),v("course")+", due "+v("due"))})}
 else if(id==="sb"){const t=tasks.find(x=>x.id===v("tid"));if(t)safe(db.doc("subs/"+t.id+"_"+me.id).set({tid:t.id,by:me.id,byName:m.name,section:m.section||"",link:v("link"),note:v("note"),at:Date.now()})).then(()=>{subOpen=null;toast("Assignment submitted.");render()})}
 else if(id==="af"){const s=slots.find(x=>x.id===attSlot);if(!s)return;const marks={};members.filter(p=>p.role==="student"&&p.section===s.section).forEach(p=>marks[p.id]=f.has("p_"+p.id)?"p":"a");safe(db.doc("att/"+s.id+"_"+attDate).set({slot:s.id,date:attDate,section:s.section,course:s.course,by:me.id,cancelled:f.has("cancel"),marks})).then(()=>toast("Attendance saved."))}
 else if(id==="nf"){notify(v("to"),v("title"),v("body")).then(()=>{e.target.reset();toast("Notification sent.")})}
 else if(id==="sf"){
  const n={course:v("course"),section:v("section"),faculty:v("faculty"),room:v("room"),day:+v("day"),start:v("start"),end:v("end"),by:me.id};
  if(mins(n.start)<H0*60||mins(n.end)>H1*60)err="Classes must fall between 08:00 and 18:00.";
  else if(mins(n.end)<=mins(n.start))err="The end time must be after the start time.";
  else{const c=clash(n);if(c.length)err="Clash with "+c[0].s.course+" ("+c[0].s.start+"–"+c[0].s.end+"): same "+c[0].why.join(", ")+". Choose another slot.";else{err="";safe(db.collection("slots").add(n));notify("sec:"+n.section,"Timetable updated",n.course+" added on "+DAYS[n.day]+" "+n.start+"–"+n.end+", room "+n.room)}}
  render();
 }
});
const sub=(p,set)=>db.collection(p).onSnapshot(s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));lastSync=Date.now();render()},()=>{});
async function main(){
 try{await boot()}catch(e){console.error(e);app.innerHTML='<div class="panel gate"><h1>Campus Scheduler</h1><p class="meta">Could not reach the database. Check your internet and reload.</p></div>'}
 if(!db||!user)return;
 app.innerHTML='<p class="empty">Loading…</p>';
 setTimeout(()=>{if(app.innerHTML.includes("Loading…"))app.innerHTML='<div class="panel gate"><h1>Campus Scheduler</h1><p class="err">Loading is stuck. Details: '+esc(window._lastErr||"no error reported")+'</p><button class="btn sm" data-a="out">Sign out</button></div>'},8000);
 me=await user.me();track("open");
 sub("members",l=>{members=l;loaded=true;if(!M()&&me.isOwner&&!creating){creating=true;safe(db.doc("members/"+me.id).set({name:me.name||"Admin",role:"admin",section:"",status:"active"}))}});
 sub("slots",l=>slots=l);sub("tasks",l=>tasks=l);sub("subs",l=>subs=l);sub("att",l=>att=l);sub("notes",l=>notes=l);
 db.collection("data/users/"+me.id).doc("seen").onSnapshot(s=>{seen=(s.exists&&s.data().t)||0;render()},()=>{});
 db.collection("data/users/"+me.id).doc("done").onSnapshot(s=>{done=(s.exists&&s.data().m)||{};render()},()=>{});
}
main();
</script>
</body>
</html>
